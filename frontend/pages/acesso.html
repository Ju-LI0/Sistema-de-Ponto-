<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status do acesso | TAG Serviços</title>

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5f9;color:#172333;font:16px Arial,sans-serif}.card{width:min(92%,540px);padding:48px;background:white;border-radius:18px;box-shadow:0 18px 55px #19344d18;text-align:center}.mark{width:58px;height:58px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:#eaf0ff;color:#2456d8;font-size:28px}h1{font-size:28px;margin:0 0 14px}p{color:#586777;line-height:1.65;margin:0 0 28px}a{display:inline-block;padding:13px 22px;border-radius:8px;background:#1557d5;color:white;text-decoration:none;font-weight:bold}
</style><link rel="stylesheet" href="../theme.css"></head><body><main class="card"><div class="mark" id="mark">…</div><h1 id="title">Verificando acesso</h1><p id="message"></p><a href="login.html">Voltar ao login</a></main><script>

</script></body></html>
